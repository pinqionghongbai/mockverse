server:
  port: 8082

spring:
  application:
    name: knowledge-service
  # 没有 datasource: pgvector 由 PgVectorStore 组件私有连接池直连,
  # Spring DataSource 自动配置在 KnowledgeApplication 显式 exclude。
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mockverse:
  nacos:
    # D23: 服务注册。关掉后不影响服务本体（只是控制台看不到本实例）
    enabled: ${NACOS_ENABLED:true}
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    # 留空 = 用 InetAddress.getLocalHost()；多网卡机器（Hyper-V/VPN）要显式指定
    ip: ${NACOS_REGISTER_IP:}
  vector:
    # pgvector 是本服务唯一的数据源, HikariCP 私有池直连 (不碰 Spring DataSource)
    host: ${PG_HOST:localhost}
    port: ${PG_PORT:5433}
    database: ${PG_DATABASE:mockverse}
    username: ${PG_USER:mockverse}
    password: ${PG_PASSWORD:}
    # bge-small-zh-v1.5 输出 512 维, 与建表 DDL 的 vector(512) 必须一致
    dimensions: 512
    top-k: 3

logging:
  level:
    com.mockverse.knowledge: debug
