server:
  port: 8084

spring:
  application:
    name: judge-service
  kafka:
    # D20: 单节点 KRaft Kafka（容器名 mockverse-kafka，映射 9092）
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${JUDGE_KAFKA_GROUP:judge-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # 与 interview-service 同口径：broker 不可达时 send() 阻塞 max.block.ms（默认 60s）
        # 再抛。消费者线程被它堵住 60s 会让整个分区停摆，压到 2s 快速失败。
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:2000}
    listener:
      # 手动 ack：判题成功才提交位点，见 JudgeRequestConsumer 的幂等说明
      ack-mode: manual

mockverse:
  judge:
    # MCP 端点。必须与 servlet 注册路径一致（SDK 用 requestURI 比对，见 JudgeMcpConfig）
    endpoint: /mcp
    # 工作目录根。留空走系统临时目录；每次判题建独立子目录，结束即删
    work-root: ""
    compile-timeout: 20s
    max-run-timeout: 10s
    default-run-timeout: 5s
    max-heap-mb: 256
    max-output-bytes: 8000
    max-code-length: 20000
    max-concurrent: 2
    kafka:
      # 关掉后本服务只保留 MCP 同步判题（D18 路径），不连 Kafka——
      # 这样"只想跑判题冒烟、没起 Kafka"的场景不会被消费者拖住启动
      enabled: ${JUDGE_KAFKA_ENABLED:true}
      request-topic: ${JUDGE_REQUEST_TOPIC:judge-request}
      result-topic: ${JUDGE_RESULT_TOPIC:judge-result}
      group-id: ${JUDGE_KAFKA_GROUP:judge-service}

logging:
  level:
    com.mockverse.judge: INFO
    io.modelcontextprotocol: INFO
    org.apache.kafka.clients.NetworkClient: WARN
