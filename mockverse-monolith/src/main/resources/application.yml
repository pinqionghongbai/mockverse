server:
  # 8080 被本机其它 java 进程占用(D8 实测), 且 8081 与目标架构"面试官服务"端口一致
  port: 8081

spring:
  application:
    name: mockverse-monolith
  datasource:
    # 凭据一律走环境变量, 严禁写进仓库 (章程诚信/安全红线)
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mockverse}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名 (password_hash -> passwordHash)
    map-underscore-to-camel-case: true
    # 开发期打印 SQL, 便于核对索引是否命中; 上线改 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键统一雪花 ID (应用层生成, 分库不冲突)
      id-type: assign_id

mockverse:
  interview:
    app-name: mockverse
    max-rounds: 5
    prompt-version: v3
  vector:
    # pgvector 是独立数据源, 不参与 Spring 的 DataSource 自动配置
    host: ${PG_HOST:localhost}
    port: ${PG_PORT:5433}
    database: ${PG_DATABASE:mockverse}
    username: ${PG_USER:mockverse}
    password: ${PG_PASSWORD:}
    # bge-small-zh-v1.5 输出 512 维, 与建表 DDL 的 vector(512) 必须一致
    dimensions: 512
    top-k: 3

logging:
  level:
    com.mockverse.monolith: debug
