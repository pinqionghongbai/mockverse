server:
  port: 8083

spring:
  application:
    name: resume-service
  datasource:
    # 凭据一律走环境变量, 严禁写进仓库 (章程诚信/安全红线)
    # 默认端口给 3307: 本机 3306 是无关 MySQL (CLAUDE.md 纪律), 默认值不能再踩这个坑
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:mockverse}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 同 interview-service: 故障期快速失败(3s)，不用 Spring Boot 默认的 30s。
      # 见 interview-service/src/main/resources/application.yml 同段注释（D15 八查实测）。
      connection-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名 (password_hash -> passwordHash)
    map-underscore-to-camel-case: true
    # 开发期打印 SQL, 便于核对索引是否命中; 上线改 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键统一雪花 ID (应用层生成, 分库不冲突)
      id-type: assign_id

logging:
  level:
    com.mockverse.resume: debug

mockverse:
  nacos:
    # D23: 服务注册。关掉后不影响服务本体（只是控制台看不到本实例）
    enabled: ${NACOS_ENABLED:true}
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    # 留空 = 用 InetAddress.getLocalHost()；多网卡机器（Hyper-V/VPN）要显式指定
    ip: ${NACOS_REGISTER_IP:}
