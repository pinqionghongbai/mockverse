# MockVerse 一键拉起（D24）
#
# 用法：
#   docker compose up -d --build          # 全量：五个基础设施 + 四个服务 + Nginx
#   docker compose up -d mysql pg kafka redis nacos   # 只起基础设施（服务仍用 java -jar）
#   docker compose down                   # 停止（数据卷保留）
#   docker compose down -v                # 连数据一起删（慎用）
#
# 凭据一律从仓库根的 .env 读（被 .gitignore 的 *.env 排除，模板见 docker/.env.example）。
# **不要把密码写进本文件**——这个文件是入库的。
#
# 端口口径与宿主机模式保持一致：MySQL 3307 / pgvector 5433 / Kafka 9092 /
# Redis 6379 / Nacos 8848，另外 Nginx 占 80。D8 起就定下"3307 而不是 3306"，
# 因为本机 3306 另有一个无关的 MySQL 实例（CLAUDE.md 纪律）。

name: mockverse

# ---------------------------------------------------------------------------
# 基础设施
# ---------------------------------------------------------------------------

services:
  mysql:
    image: mysql:8.0
    container_name: mockverse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请先配置 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockverse}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # **建表脚本必须自动执行**（D29）：镜像由空卷初始化时才跑一次。
      # 挂在入口脚本目录里，用 MySQL 官方机制，不额外写初始化代码。
      # 源文件直接取 interview-service 的资源，**不复制副本**——避免三份 DDL 各自漂移
      # （resume-service 下那份与它逐字一致，D21 已 diff 过）。
      # ⚠️ 只在 **mysql-data 卷为空** 时执行；已有库里表存在则不会覆盖。
      - ./interview-service/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      # 中文排序与大小写：建表 SQL 里用的是 utf8mb4，这里显式对齐
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # 用 mysqladmin ping 而不是 mysql 查询：前者在初始化阶段就会失败，
      # 能准确表达"还没准备好接受连接"
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [mockverse]

  pg:
    image: pgvector/pgvector:pg16
    container_name: mockverse-pg
    environment:
      POSTGRES_DB: ${PG_DATABASE:-mockverse}
      POSTGRES_USER: ${PG_USER:-mockverse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 未设置，请先配置 .env}
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 建扩展脚本：pgvector 扩展必须显式 CREATE EXTENSION，否则 vector 类型不可用
      - ./docker/pg/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mockverse} -d ${PG_DATABASE:-mockverse}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks: [mockverse]

  kafka:
    image: apache/kafka:3.9.0
    container_name: mockverse-kafka
    environment:
      # ---- 双 listener：容器内用 INTERNAL，宿主机用 EXTERNAL ----
      # 为什么必须两个：服务容器化后走 kafka:9094；但开发时仍可能用 java -jar 跑服务
      # （D15-D23 的既有流程），那时走 localhost:9092。只配一个的话，两种模式必有一种连不上。
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9094,EXTERNAL://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 单机演示：默认 168 小时（7 天）的日志保留没必要占盘
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # kafka-broker-api-versions 是官方镜像自带的探针工具
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    networks: [mockverse]

  redis:
    image: redis:7.2-alpine
    container_name: mockverse-redis
    # 演示用不设密码：容器只在本地 6379 暴露，且服务端 REDIS_PASSWORD 留空即对齐。
    # 若要对外暴露，加 --requirepass 并同步配置 REDIS_PASSWORD。
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [mockverse]

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: mockverse-nacos
    environment:
      MODE: standalone
      # 认证关闭：与 D23 的既有配置一致。**这意味着配置内容外部可写**——
      # 只在本地/内网使用；对外部署前必须打开认证并改默认口令。
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    networks: [mockverse]

# ---------------------------------------------------------------------------
# 业务服务
#
# 启动顺序不是随便排的：interview-service 在 @PostConstruct 里就要拉
# knowledge/resume 的 AgentCard（MultiAgentFactory），拉不到直接启动失败（D16 建议 3 的
# fail-fast）。所以它必须等这两个 healthy，而不是仅仅 started。
# ---------------------------------------------------------------------------

  knowledge-service:
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        JAR_FILE: knowledge-service/target/knowledge-service-0.1.0-SNAPSHOT.jar
    container_name: mockverse-knowledge
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      # 容器内一律用服务名，不是 localhost——localhost 在容器里指向自己
      PG_HOST: pg
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-mockverse}
      PG_USER: ${PG_USER:-mockverse}
      PG_PASSWORD: ${PG_PASSWORD}
      # 知识库服务也要模型：Agentic RAG 的最终生成走 DeepSeek（D12）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      NACOS_SERVER_ADDR: nacos:8848
      # AgentCard 里的 url（D24 容器化的关键）：**必须是容器网络内可达的地址**。
      # 默认值是 http://localhost:8082 —— interview 拿到卡片后往 localhost 发请求，
      # 而在 interview 容器里 localhost 指向它自己，结果 ConnectException。
      MOCKVERSE_A2A_PUBLIC_URL: http://knowledge-service:8082
    ports:
      - "8082:8082"
    depends_on:
      pg: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [mockverse]

  resume-service:
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        JAR_FILE: resume-service/target/resume-service-0.1.0-SNAPSHOT.jar
    container_name: mockverse-resume
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockverse}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      NACOS_SERVER_ADDR: nacos:8848
      # 同 knowledge：卡片 url 必须是容器内可达地址
      MOCKVERSE_A2A_PUBLIC_URL: http://resume-service:8083
    ports:
      - "8083:8083"
    depends_on:
      mysql: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [mockverse]

  judge-service:
    build:
      context: .
      dockerfile: docker/service/Dockerfile.judge
      args:
        JAR_FILE: judge-service/target/judge-service-0.1.0-SNAPSHOT.jar
    container_name: mockverse-judge
    environment:
      TZ: Asia/Shanghai
      # 不用 JAVA_TOOL_OPTIONS：它会被判题时派生的 javac/java 子进程继承，
      # 往 stderr 打 "Picked up JAVA_TOOL_OPTIONS: ..."，污染程序输出（D25 发现）
      MOCKVERSE_HEAP: "192m"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      NACOS_SERVER_ADDR: nacos:8848
    ports:
      - "8084:8084"
    depends_on:
      kafka: { condition: service_healthy }
      nacos: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks: [mockverse]

  interview-service:
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        JAR_FILE: interview-service/target/interview-service-0.1.0-SNAPSHOT.jar
    container_name: mockverse-interview
    environment:
      TZ: Asia/Shanghai
      # 面试服务是内存大户：ADK 编排树 + 三个 Agent + MCP 客户端
      JAVA_TOOL_OPTIONS: "-Xmx320m"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mockverse}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER_ADDR: nacos:8848
      # A2A 远端地址：容器内走服务名。**不能用 localhost**——
      # interview 与 knowledge 是两个容器，localhost 指自己。
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8082
      RESUME_SERVICE_URL: http://resume-service:8083
      JUDGE_SERVICE_URL: http://judge-service:8084/mcp
      # interview 自己的卡片也被外部拉取（/a2a/v1 经 nginx 暴露），这里给容器内地址；
      # 外部客户端若要用卡片里的 url 访问，应改指网关地址（见 STATUS 6.4 的说明）
      MOCKVERSE_A2A_PUBLIC_URL: http://interview-service:8081
    ports:
      - "8081:8081"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      nacos: { condition: service_healthy }
      knowledge-service: { condition: service_healthy }
      resume-service: { condition: service_healthy }
      judge-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    networks: [mockverse]

# ---------------------------------------------------------------------------
# 反向代理
# ---------------------------------------------------------------------------

  nginx:
    image: nginx:1.27-alpine
    container_name: mockverse-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
      # D25 前端：挂载而不是 COPY 进镜像——改一行刷新就生效，演示迭代期不用重建
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - interview-service
      - knowledge-service
      - resume-service
    healthcheck:
      # 必须用 127.0.0.1 而不是 localhost：nginx 只 listen 了 0.0.0.0:80（IPv4），
      # 而容器内 localhost 优先解析到 ::1，wget 会 Connection refused（D24 实测 FailingStreak=27）
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [mockverse]

# ---------------------------------------------------------------------------
# 数据卷
# ---------------------------------------------------------------------------

volumes:
  mysql-data:
  pg-data:
  kafka-data:
  redis-data:
  nacos-data:

networks:
  mockverse:
    driver: bridge
