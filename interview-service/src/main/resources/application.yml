server:
  # 8081 与目标架构"面试官服务"端口一致 (D8 起的注释口径, 拆分后不变)
  port: 8081

spring:
  application:
    name: interview-service
  datasource:
    # 凭据一律走环境变量, 严禁写进仓库 (章程诚信/安全红线)
    # 默认端口给 3307: 本机 3306 是无关 MySQL (CLAUDE.md 纪律), 默认值不能再踩这个坑
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:mockverse}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL 宕机时不要每个请求阻塞 30 秒（Spring Boot 默认 connectionTimeout=30s）。
      # D15 八查实测: 故障期 /api/health 与 /api/interview/start 各阻塞 30.1s 才返回，
      # 而 knowledge-service 的 pgvector 池是 3s 快速失败——三服务失败速度应一致。
      # 3s 只影响"从池里拿连接"的等待，不影响正常查询耗时。
      connection-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名 (password_hash -> passwordHash)
    map-underscore-to-camel-case: true
    # 开发期打印 SQL, 便于核对索引是否命中; 上线改 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键统一雪花 ID (应用层生成, 分库不冲突)
      id-type: assign_id

mockverse:
  interview:
    app-name: mockverse
    max-rounds: 5
    prompt-version: v3
  remote:
    # D17 跨进程子 Agent 的地址。interview-service 必须在 8082/8083 之后启动：
    # MultiAgentFactory 建树时会拉这两张 AgentCard，拉不到就启动失败（fail-fast，见 RemoteAgentProperties）
    knowledge-url: ${KNOWLEDGE_SERVICE_URL:http://localhost:8082}
    resume-url: ${RESUME_SERVICE_URL:http://localhost:8083}
    # 单次跨进程调用上限（秒）。SDK 的 HTTP 客户端没有读超时，远端挂死会永久占住订阅线程；
    # 服务端自身 30s 就会放回 working 快照，60s 留一倍余量（见 RemoteAgentProperties）
    timeout-seconds: ${REMOTE_AGENT_TIMEOUT_SECONDS:60}
  judge:
    # D18 判题 MCP Server（judge-service:8084）。关掉开关后面试官只是没有 judge_code，
    # 面试流程照常走；服务起不来时由 ResilientMcpToolset 降级，不会拖垮整轮对话
    enabled: ${JUDGE_MCP_ENABLED:true}
    url: ${JUDGE_SERVICE_URL:http://localhost:8084/mcp}
    # 握手超时。ADK 的 StreamableHttpServerParameters 默认 timeout=30s、readTimeout=5min，
    # McpToolset 内部还会重试 3 次——服务挂死（接受连接不响应）时最坏 3×30s 起步。
    # 判题服务没起（连接拒绝）时是快速失败，实测整轮 5.7s。这里压到 10s
    init-timeout: ${JUDGE_MCP_INIT_TIMEOUT:10s}
    # 单次 judge_code 调用上限：判题服务自身 10s 运行 + 20s 编译 + 排队，45s 留足余量
    request-timeout: ${JUDGE_MCP_REQUEST_TIMEOUT:45s}
    # 加载失败后的冷却：这段时间内不再尝试，避免每轮都付一次超时代价
    failure-cooldown: ${JUDGE_MCP_FAILURE_COOLDOWN:30s}

logging:
  level:
    com.mockverse.interview: debug
