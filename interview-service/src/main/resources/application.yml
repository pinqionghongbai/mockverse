server:
  # 8081 与目标架构"面试官服务"端口一致 (D8 起的注释口径, 拆分后不变)
  port: 8081

spring:
  application:
    name: interview-service
  datasource:
    # 凭据一律走环境变量, 严禁写进仓库 (章程诚信/安全红线)
    # 默认端口给 3307: 本机 3306 是无关 MySQL (CLAUDE.md 纪律), 默认值不能再踩这个坑
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:mockverse}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # MySQL 宕机时不要每个请求阻塞 30 秒（Spring Boot 默认 connectionTimeout=30s）。
      # D15 八查实测: 故障期 /api/health 与 /api/interview/start 各阻塞 30.1s 才返回，
      # 而 knowledge-service 的 pgvector 池是 3s 快速失败——三服务失败速度应一致。
      # 3s 只影响"从池里拿连接"的等待，不影响正常查询耗时。
      connection-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      # D23: 缓存/锁/限流三项能力共用一个实例。容器名 mockverse-redis，宿主 6379
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # 命令超时与连接超时都压到 2s：Redis 宕机时 health/缓存回源最多等 2s，
      # 不会像 MCP 工具那样默认 30s 把请求拖死（D23 实测：停容器后 start 6.17s 含一次 2s 超时）
      timeout: 2s
      connect-timeout: 2s
      # 刻意**不配** lettuce.pool：Spring Boot 的 Lettuce 连接池是
      # @ConditionalOnClass(GenericObjectPool.class) 的，而 commons-pool2 不在依赖里
      # （spring-boot-starter-data-redis 不传递它，D23 用 dependency:tree 确认 0 命中）。
      # 写了 pool 配置也不会生效，只会让下一个人以为连接池在起作用——D23 二查把这段删了。
      # Lettuce 默认是单条 native 连接多路复用，本项目并发量（单人面试、几条 SSE）远不到需要池化的程度。
  kafka:
    # D20: 单节点 KRaft Kafka（容器名 mockverse-kafka，映射 9092）
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # D20 二查修正：KafkaProducer.send() 在拿不到元数据时会**阻塞** max.block.ms（默认 60000）
        # 再抛异常。实测 broker 停机时"提交"要卡满 60s 才返回 FAILED，直接违反
        # "提交即返回判题中"。压到 2s：连不上就快速失败，状态如实变 FAILED。
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:2000}
    consumer:
      group-id: ${INTERVIEW_KAFKA_GROUP:interview-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis-plus:
  configuration:
    # 下划线列名 -> 驼峰属性名 (password_hash -> passwordHash)
    map-underscore-to-camel-case: true
    # 开发期打印 SQL, 便于核对索引是否命中; 上线改 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键统一雪花 ID (应用层生成, 分库不冲突)
      id-type: assign_id

mockverse:
  interview:
    app-name: mockverse
    max-rounds: 5
    prompt-version: v3
    kafka:
      # D20 异步判题。关掉后 /judge 接口仍然存在但提交会立刻变成 FAILED——
      # 之所以提供开关，是为了"只想跑 D19 的同步链路"时不用起 Kafka
      enabled: ${INTERVIEW_KAFKA_ENABLED:true}
      judge-request-topic: ${JUDGE_REQUEST_TOPIC:judge-request}
      judge-result-topic: ${JUDGE_RESULT_TOPIC:judge-result}
      group-id: ${INTERVIEW_KAFKA_GROUP:interview-service}
  remote:
    # D17 跨进程子 Agent 的地址。interview-service 必须在 8082/8083 之后启动：
    # MultiAgentFactory 建树时会拉这两张 AgentCard，拉不到就启动失败（fail-fast，见 RemoteAgentProperties）
    knowledge-url: ${KNOWLEDGE_SERVICE_URL:http://localhost:8082}
    resume-url: ${RESUME_SERVICE_URL:http://localhost:8083}
    # 单次跨进程调用上限（秒）。SDK 的 HTTP 客户端没有读超时，远端挂死会永久占住订阅线程；
    # 服务端自身 30s 就会放回 working 快照，60s 留一倍余量（见 RemoteAgentProperties）
    timeout-seconds: ${REMOTE_AGENT_TIMEOUT_SECONDS:60}
  judge:
    # D18 判题 MCP Server（judge-service:8084）。关掉开关后面试官只是没有 judge_code，
    # 面试流程照常走；服务起不来时由 ResilientMcpToolset 降级，不会拖垮整轮对话
    enabled: ${JUDGE_MCP_ENABLED:true}
    url: ${JUDGE_SERVICE_URL:http://localhost:8084/mcp}
    # 握手超时。ADK 的 StreamableHttpServerParameters 默认 timeout=30s、readTimeout=5min，
    # McpToolset 内部还会重试 3 次——服务挂死（接受连接不响应）时最坏 3×30s 起步。
    # 判题服务没起（连接拒绝）时是快速失败，实测整轮 5.7s。这里压到 10s
    init-timeout: ${JUDGE_MCP_INIT_TIMEOUT:10s}
    # 单次 judge_code 调用上限：判题服务自身 10s 运行 + 20s 编译 + 排队，45s 留足余量
    request-timeout: ${JUDGE_MCP_REQUEST_TIMEOUT:45s}
    # 加载失败后的冷却：这段时间内不再尝试，避免每轮都付一次超时代价
    failure-cooldown: ${JUDGE_MCP_FAILURE_COOLDOWN:30s}
  redis:
    # D23: 三项能力的参数集中在这里，量级关系一眼可见
    # 题库只在启动期补种，10 分钟足够；补种完成后 QuestionSeeder 会主动失效
    question-ttl: ${REDIS_QUESTION_TTL:10m}
    # 空结果缓存 30s（防穿透）：补种/改分类后最多半分钟可见
    empty-ttl: ${REDIS_EMPTY_TTL:30s}
    # 会话锁要覆盖整条 SSE 流，与 InterviewController.SSE_TIMEOUT_MILLIS 同值
    session-lock-ttl: ${REDIS_SESSION_LOCK_TTL:180s}
    # 单用户每分钟 SSE 上限：一场面试最多 5 轮，这个值只挡脚本狂刷
    sse-per-minute: ${REDIS_SSE_PER_MINUTE:30}
  nacos:
    # D23: 服务注册 + 动态配置。关掉后不影响面试主流程（只是控制台看不到本实例）
    enabled: ${NACOS_ENABLED:true}
    server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    # 留空 = 用 InetAddress.getLocalHost()；多网卡机器（Hyper-V/VPN）要显式指定
    ip: ${NACOS_REGISTER_IP:}
    # 配置监听的 data-id。留空 = <spring.application.name>.yaml
    config-data-id: ${NACOS_CONFIG_DATA_ID:}

logging:
  level:
    com.mockverse.interview: debug
