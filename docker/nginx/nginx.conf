# MockVerse 反向代理（D24）
#
# 统一入口 80 端口，按路径前缀分发到四个服务。
# 端口口径：interview 8081 / knowledge 8082 / resume 8083 / judge 8084（judge 不对外）。
#
# **SSE 是这里最容易踩坑的地方**：nginx 默认开启 proxy_buffering，会把上游的
# 事件流攒在缓冲区里，浏览器一个 chunk 都收不到——表现为"流式接口卡住、最后一次性吐完"。
# 所有 SSE 路径必须显式关闭缓冲（见下方 location 段）。

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # **不要 include /etc/nginx/conf.d/*.conf**：官方镜像自带 default.conf，
    # 它监听 80 并启用 server_name _，会与我们的 server 抢同一个端口——
    # 实测表现为访问 / 看到 "Welcome to nginx!"（D25）。
    # 我们只需要 conf.d/proxy-common.conf 这段被 location include，不需要整目录 include。

    # 日志格式带 upstream 耗时，排障时能直接看出是哪个服务慢
    log_format  main  '$remote_addr - $status "$request" '
                      'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    keepalive_timeout  65;

    # 请求体上限：简历诊断要贴整份简历（D11 实测最长约 8KB），判题要贴代码（上限 20000 字符）。
    # 给 1m 足够，同时挡住误传大文件。
    client_max_body_size 1m;

    # 上游统一超时。SSE 路径会单独覆盖 read_timeout（见 location 段）。
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ---------------------------------------------------------------
    # 健康检查（nginx 自身）
    # ---------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # nginx 容器自己的 healthcheck 打这里
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------
        # 各服务健康探针（三个服务都有 /api/health，靠前缀区分）
        # -----------------------------------------------------------
        location = /healthz/interview {
            proxy_pass http://interview-service:8081/api/health;
        }
        location = /healthz/knowledge {
            proxy_pass http://knowledge-service:8082/api/health;
        }
        location = /healthz/resume {
            proxy_pass http://resume-service:8083/api/health;
        }
        location = /healthz/judge {
            proxy_pass http://judge-service:8084/health;
        }

        # -----------------------------------------------------------
        # SSE（必须写在普通前缀之前语义上先匹配——nginx 正则优先于前缀）
        # -----------------------------------------------------------
        # 覆盖：/api/interview/{sessionId}/answer/stream 与 /api/interview/{sessionId}/judge/stream
        location ~ ^/api/interview/[^/]+/(answer|judge)/stream$ {
            # 公共头（Host / X-Real-IP / X-Forwarded-* / Connection ""）与其它 location 保持一致。
            # 少了这几个头，上游日志里看不到真实客户端 IP，ProblemDetail 的 instance 也拿不到外部地址。
            include /etc/nginx/conf.d/proxy-common.conf;

            proxy_pass http://interview-service:8081$request_uri;

            # 关缓冲是 SSE 能工作的前提
            proxy_buffering off;
            proxy_cache off;
            # **必须保持 chunked（D26）**：早先这里是 off，nginx 于是用
            # "Connection: close + 无 Content-Length" 的方式定界——对直连没问题，
            # 但中间的隧道/CDN 拿不到分帧信息，会把响应攒到自己缓冲区里等 EOF。
            # 实测：Cloudflare Tunnel 下判题结果流 24s 收到 0 字节，而同一路径本地立刻收到。
            # 打开 chunked 后每个 SSE 事件就是一个独立 chunk，中间层可以逐块转发。
            chunked_transfer_encoding on;

            # 流式响应可能持续整轮对话（interview 侧 SSE 超时 180s，Agent 整轮上限 120s），
            # 这里给 300s 留余量；不能用默认的 120s，否则长回答会被 nginx 提前掐断
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # 客户端断开时立刻通知上游，别让 nginx 继续等
            proxy_ignore_client_abort off;
        }

        # -----------------------------------------------------------
        # 业务接口
        # -----------------------------------------------------------
        location /api/interview/ {
            proxy_pass http://interview-service:8081;
            include /etc/nginx/conf.d/proxy-common.conf;
        }
        location /api/knowledge/ {
            proxy_pass http://knowledge-service:8082;
            include /etc/nginx/conf.d/proxy-common.conf;
        }
        location /api/resume/ {
            proxy_pass http://resume-service:8083;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # 默认健康检查落到面试服务（对外"服务活着吗"这个问题，8081 是最有代表性的答案）
        location = /api/health {
            proxy_pass http://interview-service:8081/api/health;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # -----------------------------------------------------------
        # A2A 协议端点（只暴露 interview 的；knowledge/resume 的 A2A 由 interview 内部调用）
        # -----------------------------------------------------------
        location /a2a/ {
            proxy_pass http://interview-service:8081;
            include /etc/nginx/conf.d/proxy-common.conf;
        }
        location = /.well-known/agent-card.json {
            proxy_pass http://interview-service:8081/.well-known/agent-card.json;
            include /etc/nginx/conf.d/proxy-common.conf;
        }

        # -----------------------------------------------------------
        # 前端静态资源（D25）
        # -----------------------------------------------------------
        # 必须放在最后：nginx 前缀匹配取"最长匹配"，所以 /api/* 会先命中上面的
        # location。但为了不让打错的 /api/xxx 掉进静态兜底返回 index.html
        # （前端会拿到 HTML 当 JSON 解析，报一个莫名其妙的语法错误），
        # 下面显式给 /api/ 一个 404。
        location /api/ {
            default_type application/json;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"没有这个接口"}';
        }

        # 前端单页。web/ 目录由 compose 挂载到 /usr/share/nginx/html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # HTML/JS/CSS 每次都校验，改完刷新就生效（演示迭代期比缓存重要）
            add_header Cache-Control "no-cache";
        }
    }
}
