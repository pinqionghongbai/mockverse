# 所有非 SSE 的 proxy location 共用（DRY）
# 由 nginx.conf 通过 include /etc/nginx/conf.d/proxy-common.conf 引入

proxy_http_version 1.1;

# 透传原始 Host 与客户端 IP：服务端日志与 ProblemDetail 的 instance 字段要用
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 清掉 Connection 头，让 nginx 与上游走 keep-alive（http_version 1.1 下必需）
proxy_set_header Connection "";

# 上游出错时不要静默重试到另一个节点（本项目每个服务只有一个实例，
# 重试只会把同一个请求再打一次，对 LLM 接口意味着重复扣费）
proxy_next_upstream off;
